<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বেকার থাকার দিন শেষ</title>
<style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}header{background:#111827;color:white;padding:16px;display:flex;justify-content:space-between}main{max-width:850px;margin:auto;padding:18px}.card{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccd3db}button{background:#111827;color:white;border:0}.balance{font-size:30px;font-weight:bold}a{color:#2563eb;cursor:pointer}</style>
<header><b>বেকার থাকার দিন শেষ</b><button style="width:auto" onclick="admin()">Admin</button></header><main id="app"></main>
<script>
const $=x=>document.querySelector(x);const api=async(u,o={})=>{let r=await fetch(u,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"সমস্যা");return d};
function login(){app.innerHTML='<div class=card><h2>লগইন</h2><input id=l placeholder="ফোন নম্বর / Gmail" autocomplete="username"><input id=p type=password placeholder="পাসওয়ার্ড" autocomplete="current-password"><button onclick="doLogin()">লগইন</button><p>নতুন? <a onclick="reg()">রেজিস্টার</a></p><div id=m></div></div>'}
function reg(){let ref=new URLSearchParams(location.search).get("ref")||"";app.innerHTML='<div class=card><h2>রেজিস্টার</h2><input id=r placeholder="ফোন নম্বর / Gmail"><input id=p1 type=password placeholder="পাসওয়ার্ড" autocomplete="new-password"><input id=p2 type=password placeholder="কনফার্ম পাসওয়ার্ড" autocomplete="new-password"><input id=rf value="'+ref+'" placeholder="রেফার কোড"><button onclick="doReg()">একাউন্ট তৈরি করুন</button><p>আগে account আছে? <a onclick="login()">লগইন</a></p><div id=m></div></div>'}
async function doReg(){try{await api("/api/register",{method:"POST",body:JSON.stringify({login:r.value,password:p1.value,confirmPassword:p2.value,referralCode:rf.value})});home()}catch(e){m.textContent=e.message}}
async function doLogin(){try{await api("/api/login",{method:"POST",body:JSON.stringify({login:l.value,password:p.value})});home()}catch(e){m.textContent=e.message}}
async function home(){try{let d=await api("/api/me");app.innerHTML='<div class=card><h3>স্বাগতম</h3><div class=balance>৳'+Number(d.user.balance).toFixed(2)+'</div><p>Referral: '+d.user.referral_code+'</p></div><div class=card><button onclick="content()">কাজ / Ad / Video</button><button onclick="withdraw()">Withdraw</button><button onclick="logout()">Logout</button></div>'}catch{login()}}
async function content(){let d=await api("/api/content");app.innerHTML='<div class=card><h2>কাজ</h2>'+d.tasks.map(t=>'<p>'+t.title+' — ৳'+t.reward+' <button onclick="claim('+t.id+')">Claim</button></p>').join("")+'</div><div class=card><h2>Ad</h2>'+d.ads.map(a=>'<p>'+a.title+' — ৳'+a.reward+' <button onclick="ad('+a.id+','+a.min_seconds+')">Complete</button></p>').join("")+'</div><button onclick="home()">হোম</button>'}
async function claim(id){try{alert((await api("/api/tasks/"+id+"/claim",{method:"POST"})).reward+" টাকা যোগ হয়েছে");home()}catch(e){alert(e.message)}}async function ad(id,s){alert("কমপক্ষে "+s+" সেকেন্ড দেখো");try{await api("/api/ads/"+id+"/complete",{method:"POST",body:JSON.stringify({seconds:s})});alert("Reward যোগ হয়েছে");home()}catch(e){alert(e.message)}}
function withdraw(){app.innerHTML='<div class=card><h2>Withdraw</h2><p>সর্বনিম্ন ৳1200, সর্বোচ্চ ৳25000</p><select id=wm><option value=bkash>bKash</option><option value=nagad>Nagad</option><option value=rocket>Rocket</option></select><input id=wn placeholder="নম্বর"><input id=wa type=number placeholder="পরিমাণ"><button onclick="sendW()">Submit</button><button onclick="home()">ফিরে যান</button><div id=m></div></div>'}
async function sendW(){try{await api("/api/withdraw",{method:"POST",body:JSON.stringify({method:wm.value,number:wn.value,amount:Number(wa.value)})});alert("Admin-এর কাছে request গেছে");home()}catch(e){m.textContent=e.message}}
async function logout(){await api("/api/logout",{method:"POST"});login()}
async function admin(){let p=prompt("Admin password");if(p===null)return;try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:p})});let d=await api("/api/admin/data");app.innerHTML='<div class=card><h2>Admin Panel</h2><h3>Users</h3>'+d.users.map(u=>'<p>'+u.login+' — ৳'+u.balance+' <button onclick="ban('+u.id+')">3 দিন Ban</button></p>').join("")+'</div><div class=card><h3>Add Task</h3><input id=tt placeholder=Title><input id=tr type=number placeholder=Reward><button onclick="addT()">Add</button><h3>Add Ad</h3><input id=at placeholder=Title><input id=ar type=number value=5><button onclick="addA()">Add</button></div><div class=card><h3>Withdrawals</h3>'+d.withdrawals.map(w=>'<p>#'+w.id+' '+w.method+' '+w.payout_number+' ৳'+w.amount+' '+w.status+' <button onclick="ap('+w.id+')">Approve</button><button onclick="re('+w.id+')">Reject</button></p>').join("")+'</div>'}catch(e){alert(e.message)}}
async function ban(id){await api("/api/admin/users/"+id+"/ban",{method:"POST"});alert("৩ দিনের জন্য ban হয়েছে");admin()}async function addT(){await api("/api/admin/tasks",{method:"POST",body:JSON.stringify({title:tt.value,reward:Number(tr.value)})});admin()}async function addA(){await api("/api/admin/ads",{method:"POST",body:JSON.stringify({title:at.value,reward:Number(ar.value),minSeconds:15})});admin()}async function ap(id){await api("/api/admin/withdrawals/"+id+"/approve",{method:"POST"});admin()}async function re(id){await api("/api/admin/withdrawals/"+id+"/reject",{method:"POST"});admin()}home();
</script></html>
