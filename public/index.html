<body>

<header>

<main id="app"></main>

<script>

const app = document.getElementById("app");

const api = async (url, options = {}) => {

  const response = await fetch(url,{
    credentials:"same-origin",
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    },
    ...options
  });

  const data = await response.json().catch(()=>({}));

  if(!response.ok){
    throw new Error(data.error || "সমস্যা হয়েছে");
  }

  return data;
};


/* =========================
   HOME
========================= */

async function home(){

    app.innerHTML = `

      <div class="card">

        <h2>স্বাগতম 👋</h2>

          Referral Code:

        </p>

          💰 কাজ করে টাকা আয়
        </button>

        <button onclick="withdrawPage()">
          💳 Withdraw
        </button>

        <button onclick="mySubmissions()">

========================= */

/* =========================
   TASK LIST
========================= */

async function showTasks(){

  try{

    const data = await api("/api/content");

    let html = `

      <div class="card">

        <h2>আজকের কাজ</h2>

        <p class="small">
          কাজ করার আগে Admin দেওয়া নির্দেশনা ভালোভাবে দেখুন।
        </p>

      </div>
    `;

    if(!data.tasks.length){

      html += `
        <div class="card">
          <p>এখন কোনো কাজ নেই।</p>
        </div>
      `;

    }

    for(const task of data.tasks){

      const submission =
        data.submissions.find(
          s => Number(s.task_id) === Number(task.id)
        );

      let status = "";

      if(submission){

        if(submission.status === "pending"){
          status =
            `<p class="pending">⏳ Pending — Admin যাচাই করছে</p>`;
        }

        if(submission.status === "approved"){
          status =
            `<p class="approved">✅ Approved — Reward দেওয়া হয়েছে</p>`;
        }

        if(submission.status === "rejected"){
          status =
            `<p class="rejected">❌ Rejected</p>`;
        }

      }

      let button = "";

      if(task.type === "ad"){

        button = `
          <button onclick="startAd(${task.id})">
            ▶️ Ad দেখুন
          </button>
        `;

      }else{

        if(submission){

          button = "";

        }else{

          button = `
            <button onclick="openTask(${task.id})">
              কাজ করুন
            </button>
          `;

        }

      }

      html += `

        <div class="card task">

          <span class="tag">
            ${taskTypeName(task.type)}
          </span>

          <h3>
            ${escapeHtml(task.title)}
          </h3>

          ${
            task.description
            ? `<p>${escapeHtml(task.description)}</p>`
            : ""
          }

          <p>
            Reward:
            <b>৳${Number(task.reward).toFixed(2)}</b>
          </p>

          ${status}

          ${button}

        </div>
      `;
    }

    html += `
      <button class="gray" onclick="home()">
        ← Home
      </button>
    `;

    app.innerHTML = html;

  }catch(e){

    alert(e.message);
    home();

  }

}


function taskTypeName(type){

  if(type === "ad") return "Ad দেখুন";

  if(type === "facebook") return "Facebook Like";

  if(type === "youtube") return "YouTube";

  return "কাজ";

}


/* =========================
   AD
========================= */

async function startAd(id){

  try{

    const data = await api(
      "/api/tasks/" + id + "/start-ad",
      {
        method:"POST"
      }
    );

    let seconds = Number(data.seconds || 15);

    app.innerHTML = `

      <div class="card">

        <h2>Ad দেখুন</h2>

        <p>
          নিচের Ad-এ ক্লিক করুন এবং পুরো সময় অপেক্ষা করুন।
        </p>

        <button
          onclick="window.open('${safeUrl(data.url)}','_blank')"
        >
          🔗 Ad খুলুন
        </button>

        <h3 id="timer">
          ${seconds} সেকেন্ড বাকি
        </h3>

        <button
          id="completeAdButton"
          disabled
          onclick="completeAd(${id},'${data.token}')"
        >
          ⏳ অপেক্ষা করুন
        </button>

        <button class="gray" onclick="showTasks()">
          ← ফিরে যান
        </button>

      </div>
    `;

    const timer = setInterval(()=>{

      seconds--;

      const timerElement =
        document.getElementById("timer");

      if(timerElement){

        timerElement.textContent =
          seconds > 0
          ? `${seconds} সেকেন্ড বাকি`
          : "সময় শেষ";

      }

      if(seconds <= 0){

        clearInterval(timer);

        const button =
          document.getElementById("completeAdButton");

        if(button){

          button.disabled = false;
          button.textContent = "✅ Reward নিন";

        }

      }

    },1000);

  }catch(e){

    alert(e.message);

  }

}


async function completeAd(id,token){

  try{

    const data = await api(
      "/api/tasks/" + id + "/complete-ad",
      {
        method:"POST",
        body:JSON.stringify({token})
      }
    );

    alert(
      "অভিনন্দন! ৳" +
      Number(data.reward).toFixed(2) +
      " Balance-এ যোগ হয়েছে।"
    );

    home();

  }catch(e){

    alert(e.message);

  }

}


/* =========================
   FACEBOOK / YOUTUBE TASK
========================= */

async function openTask(id){

  try{

    const data = await api("/api/content");

      data.tasks.find(t => Number(t.id) === Number(id));

    if(!task){

      alert("কাজ পাওয়া যায়নি");
      return;

    }

    const four =
      task.type === "youtube";

    app.innerHTML = `

      <div class="card">

        <span class="tag">
          ${taskTypeName(task.type)}
        </span>

        <h2>${escapeHtml(task.title)}</h2>

        ${
          task.description
          ? `<p>${escapeHtml(task.description)}</p>`
          : ""
        }

        <p>
          Reward:
          <b>৳${Number(task.reward).toFixed(2)}</b>
        </p>

        <h3>Admin-এর দেওয়া Screenshot</h3>

        ${
          task.reference_image
          ? `
            <img
              class="reference"
              src="${safeImage(task.reference_image)}"
            >
          `
          : `<p>কোনো Reference Screenshot দেওয়া হয়নি।</p>`
        }

        <button
          onclick="window.open('${safeUrl(task.url)}','_blank')"
        >
          🔗 ${task.type === "facebook"
            ? "Facebook পোস্ট খুলুন"
            : "YouTube ভিডিও খুলুন"}
        </button>

        <hr>

        <h3>
          ${
            four
            ? "৪টি Screenshot দিন"
            : "Screenshot দিন"
          }
        </h3>

        <p class="small">
          ${
            four
            ? "চারটি Screenshot-ই দিতে হবে।"
            : "আপনার কাজের প্রমাণের Screenshot দিন।"
          }
        </p>

        <input
          id="shot1"
          type="file"
          accept="image/*"
        >

        ${
          four
          ? `
            <input id="shot2" type="file" accept="image/*">
            <input id="shot3" type="file" accept="image/*">
            <input id="shot4" type="file" accept="image/*">
          `
          : ""
        }

        <button
          onclick="submitTask(${task.id},${four})"
        >
          📤 Screenshot জমা দিন
        </button>

        <button
          class="gray"
          onclick="showTasks()"
        >
          ← কাজের তালিকায় ফিরে যান
        </button>

      </div>
    `;

  }catch(e){

    alert(e.message);

  }

}


/* =========================
   IMAGE TO BASE64
========================= */

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    if(!file){

      resolve("");

      return;

    }

    const reader = new FileReader();

    reader.onload = () =>
      resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* =========================
   SUBMIT SCREENSHOTS
========================= */

async function submitTask(id,isYoutube){

  try{

    const s1 =
      document.getElementById("shot1").files[0];

    const s2 =
      isYoutube
      ? document.getElementById("shot2").files[0]
      : null;

    const s3 =
      isYoutube
      ? document.getElementById("shot3").files[0]
      : null;

    const s4 =
      isYoutube
      ? document.getElementById("shot4").files[0]
      : null;

    if(!s1){

      alert("Screenshot দিন");

      return;

    }

    if(
      isYoutube &&
      (!s2 || !s3 || !s4)
    ){

      alert("YouTube কাজের জন্য ৪টি Screenshot দিন");

      return;

    }

    const data = {

      screenshot1:
        await fileToBase64(s1),

      screenshot2:
        await fileToBase64(s2),

      screenshot3:
        await fileToBase64(s3),

      screenshot4:
        await fileToBase64(s4)

    };

    await api(
      "/api/tasks/" + id + "/submit",
      {
        method:"POST",
        body:JSON.stringify(data)
      }
    );

    alert(
      "কাজ জমা হয়েছে। Admin যাচাই করার পর Reward দেওয়া হবে।"
    );

    showTasks();

  }catch(e){

    alert(e.message);

  }

}


/* =========================
   MY SUBMISSIONS
========================= */

async function mySubmissions(){

  try{

    const data = await api("/api/content");

    let html = `

      <div class="card">

        <h2>আমার কাজ</h2>

    `;

    const list = data.submissions;

    if(!list.length){

      html += `<p>এখনও কোনো কাজ জমা দাওনি।</p>`;

    }else{

      for(const s of list){

        const task =
          data.tasks.find(
            t => Number(t.id) === Number(s.task_id)
          );

        html += `

          <div class="task">

            <b>
              ${escapeHtml(task?.title || "কাজ")}
            </b>

            <p>
              অবস্থা:
              <span class="${s.status}">
                ${statusBangla(s.status)}
              </span>
            </p>

          </div>
        `;

      }

    }

    html += `

      </div>

      <button class="gray" onclick="home()">
        ← Home
      </button>
    `;

    app.innerHTML = html;

  }catch(e){

    alert(e.message);

  }

}


function statusBangla(status){

  if(status === "pending") return "Pending";

  if(status === "approved") return "Approved";

  if(status === "rejected") return "Rejected";

  return status;

}

              ${
                s.screenshot4
                ? `<img class="shot" src="${safeImage(s.screenshot4)}">`
                : `<p>নেই</p>`
              }

            `
            : ""
          }

          ${
            s.status === "pending"
            ? `

              <button
                class="green"
                onclick="approveSubmission(${s.id})"
              >
                ✅ Approve
              </button>

              <button
                class="red"
                onclick="rejectSubmission(${s.id})"
              >
                ❌ Reject
              </button>

            `
            : ""
          }

        </div>
      `;

    }

    html += `

      </div>

      <div class="card">

        <h2>👥 Users</h2>
    `;

    for(const u of data.users){

      html += `

        <div class="adminBox">

          <b>
            ${escapeHtml(u.login)}
          </b>

          <p>
            Balance:
            ৳${Number(u.balance).toFixed(2)}
          </p>

          <button
            class="red"
            onclick="banUser(${u.id})"
          >
            ৩ দিনের জন্য Ban
          </button>

        </div>
      `;

    }

    html += `

      </div>

      <div class="card">

        <h2>💳 Withdrawals</h2>
    `;

    for(const w of data.withdrawals){

      html += `

        <div class="adminBox">

          <p>
            #${w.id}
          </p>

          <p>
            Method:
            ${escapeHtml(w.method)}
          </p>

          <p>
            Number:
            ${escapeHtml(w.payout_number)}
          </p>

          <p>
            Amount:
            ৳${Number(w.amount).toFixed(2)}
          </p>

          <p>
            Status:
            <b>${escapeHtml(w.status)}</b>
          </p>

          ${
            w.status === "pending"
            ? `

              <button
                class="green"
                onclick="approveWithdraw(${w.id})"
              >
                Approve
              </button>

              <button
                class="red"
                onclick="rejectWithdraw(${w.id})"
              >
                Reject
              </button>

            `
            : ""
          }

        </div>
      `;

    }

    html += `

      </div>

      <button
        class="gray"
        onclick="home()"
      >
        ← Home
      </button>
    `;

    app.innerHTML = html;

  }catch(e){

    alert(e.message);
    home();

  }

}

function taskTypeChanged(){

  const type =
    document.getElementById("taskType").value;

  const referenceBox =
    document.getElementById("referenceBox");

  const secondsBox =
    document.getElementById("secondsBox");

  if(type === "ad"){

    referenceBox.classList.add("hidden");
    secondsBox.classList.remove("hidden");

  }else{

    referenceBox.classList.remove("hidden");
    secondsBox.classList.add("hidden");

  }

}


/* =========================
   CREATE TASK
========================= */

async function createTask(){

  try{

    const type =
      document.getElementById("taskType").value;

    const title =
      document.getElementById("taskTitle").value;

    const description =
      document.getElementById("taskDescription").value;

    const url =
      document.getElementById("taskUrl").value;

    const reward =
      Number(
        document.getElementById("taskReward").value
      );

    let referenceImage = "";

    if(type !== "ad"){

      const file =
        document.getElementById("referenceFile").files[0];

      if(!file){

        alert(
          "Reference Screenshot দিন"
        );

        return;

      }

      referenceImage =
        await fileToBase64(file);

    }

    await api("/api/admin/tasks",{

      method:"POST",

      body:JSON.stringify({

        type,
        title,
        description,
        url,
        referenceImage,
        reward,

        minSeconds:
          type === "ad"
          ? Number(
              document.getElementById(
                "taskSeconds"
              ).value
            )
          : 15

      })

    });

    alert("কাজ সফলভাবে Publish হয়েছে");

    adminPanel();

  }catch(e){

    alert(e.message);

  }

}

/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeUrl(value){

  const url = String(value || "");

  if(
    url.startsWith("https://") ||
    url.startsWith("http://")
  ){

    return url
      .replaceAll("'","%27")
      .replaceAll('"',"%22");

  }

  return "#";

}


function safeImage(value){

  const image = String(value || "");

  if(
    image.startsWith("data:image/")
  ){

    return image;

  }

  return "";

}
