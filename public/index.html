<body>
 <iframe src="/banner.html" style="width:100%;height:400px;border:0;display:block;"></iframe>
<header>
<b>বেকার থাকার দিন শেষ</b>
<button class="topHome" onclick="home()">Home</button>
</header>

<main id="app"></main>

<script>
const app=document.getElementById("app");

const api=async(url,options={})=>{
 const r=await fetch(url,{
  credentials:"same-origin",
  headers:{"Content-Type":"application/json",...(options.headers||{})},
  ...options
 });
 const d=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(d.error||"সমস্যা হয়েছে");
 return d;
};

const esc=v=>String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

const safeUrl=v=>/^https?:\/\//i.test(String(v||""))
?String(v).replaceAll("'","%27").replaceAll('"',"%22")
:"#";

const safeImage=v=>String(v||"").startsWith("data:image/")?v:"";
const money=n=>"৳"+Number(n||0).toFixed(2);

function taskTypeName(t){
 return t==="ad"?"Ad দেখা":t==="facebook"?"Facebook Like":"YouTube";
}

function statusBn(s){
 return s==="pending"?"Pending":s==="approved"?"Approved":"Rejected";
}

async function home(){
 try{
  const d=await api("/api/content");
  const u=d.user;

  app.innerHTML=`
  <div class="card">
   <h2>স্বাগতম 👋</h2>
   <div class="balance">${money(u.balance)}</div>
   <p>Account: <b>${esc(u.login)}</b></p>
   <p>Referral Code: <b>${esc(u.referral_code)}</b></p>

   <div class="copybox">
   ${esc(location.origin+location.pathname+"?ref="+u.referral_code)}
   </div>

   <button onclick="copyReferral()">🔗 Referral Link কপি করুন</button>
  </div>

  <div class="card">
   <button onclick="showTasks()">💰 কাজ করুন</button>
   <button onclick="withdrawPage()">💳 Withdraw</button>
   <button onclick="mySubmissions()">📋 আমার কাজ</button>
   <button onclick="profilePage()">👤 Profile</button>
   <button onclick="messagesPage()">💬 Admin-এর সাথে কথা বলুন ${d.unreadMessages?`(${d.unreadMessages})`:""}</button>
   <button class="gray" onclick="logout()">Logout</button>
   <button class="gray" onclick="adminLogin()">Admin</button>
  </div>`;
 }catch{
  loginPage();
 }
}

async function copyReferral(){
 try{
  const d=await api("/api/me");
  const link=location.origin+location.pathname+"?ref="+d.user.referral_code;
  await navigator.clipboard.writeText(link);
  alert("Referral Link কপি হয়েছে");
 }catch{
  alert("Link কপি করা যায়নি");
 }
}

async function showTasks(){
 try{
  const d=await api("/api/content");

  let h=`<div class="card"><h2>আজকের কাজ</h2>`;

  if(!d.tasks.length)
   h+=`<p>এখন কোনো কাজ নেই।</p>`;

  for(const t of d.tasks){

   const s=d.submissions.find(
    x=>Number(x.task_id)===Number(t.id)
   );

   h+=`
   <div class="task">
    <span class="tag">${taskTypeName(t.type)}</span>
    <h3>${esc(t.title)}</h3>
    <p>${esc(t.description||"")}</p>
    <p>Reward: <b>${money(t.reward)}</b></p>

    ${
     s
     ? `<p class="${s.status}">${statusBn(s.status)}</p>`
     : t.type==="ad"
     ? `<button onclick="startAd(${t.id})">▶️ Ad দেখুন</button>`
     : `<button onclick="openTask(${t.id})">কাজ করুন</button>`
    }
   </div>`;
  }

  h+=`</div>
  <button class="gray" onclick="home()">← Home</button>`;

  app.innerHTML=h;

 }catch(e){
  alert(e.message);
 }
}

async function startAd(id){
 try{
  const d=await api("/api/tasks/"+id+"/start-ad",{
   method:"POST"
  });

  app.innerHTML=`
  <div class="card">
   <h2>Ad দেখুন</h2>

   <p>
   নিচের বাটনে Ad খুলুন।
   <b>Ad খোলার পর সময় গণনা হবে।</b>
   </p>

   <button id="openAdBtn"
   onclick="openAdAndStart('${safeUrl(d.url)}',${d.seconds},${id},'${d.token}')">
   🔗 Ad খুলুন
   </button>

   <h3 id="timer">Ad এখনও খোলা হয়নি</h3>

   <button id="completeAdButton" disabled>
   ⏳ আগে Ad খুলুন
   </button>

   <button class="gray" onclick="showTasks()">
   ← ফিরে যান
   </button>
  </div>`;
 }catch(e){
  alert(e.message);
 }
 }

function openAdAndStart(url,seconds,id,token){

 const w=window.open(url,"_blank");

 if(!w){
  alert("Ad খোলার অনুমতি দিন, তারপর আবার চাপুন");
  return;
 }

 document.getElementById("openAdBtn").disabled=true;

 const startedAt=Date.now();

 localStorage.setItem("activeAd",JSON.stringify({
  id:id,
  token:token,
  seconds:Number(seconds),
  startedAt:startedAt
 }));

 let timer=document.getElementById("timer");
 let btn=document.getElementById("completeAdButton");

 function updateTimer(){

  const elapsed=Math.floor(
   (Date.now()-startedAt)/1000
  );

  const left=Math.max(
   0,
   Number(seconds)-elapsed
  );

  timer.textContent=
   left>0
   ?left+" সেকেন্ড বাকি"
   :"সময় শেষ";

  if(left<=0){
   btn.disabled=false;
   btn.textContent="✅ Reward নিন";
   btn.onclick=()=>completeAd(id,token);
   return;
  }

  setTimeout(updateTimer,1000);
 }

 updateTimer();
 }


async function completeAd(id,token){
 try{
  const d=await api("/api/tasks/"+id+"/complete-ad",{
   method:"POST",
   body:JSON.stringify({token})
  });

  alert("৳"+Number(d.reward).toFixed(2)+" Balance-এ যোগ হয়েছে");

 }catch(e){

 }
}

async function openTask(id){
 try{
  const d=await api("/api/content");
  const t=d.tasks.find(x=>Number(x.id)===Number(id));

  if(!t)return;

  const y=t.type==="youtube";

  app.innerHTML=`
  <div class="card">

   <span class="tag">${taskTypeName(t.type)}</span>

   <h2>${esc(t.title)}</h2>

   <p>${esc(t.description||"")}</p>

   <p>Reward: <b>${money(t.reward)}</b></p>

   <h3>Admin-এর Reference Screenshot</h3>

   ${
    t.reference_image
    ? `<img class="reference" src="${safeImage(t.reference_image)}">`
    : "<p>নেই</p>"
   }

   <button onclick="window.open('${safeUrl(t.url)}','_blank')">
   🔗 Link খুলুন
   </button>

   <hr>

   <h3>${y?"৪টি Screenshot":"Screenshot"} দিন</h3>

   <input id="shot1" type="file" accept="image/*">

   ${
    y
    ? `
    <input id="shot2" type="file" accept="image/*">
    <input id="shot3" type="file" accept="image/*">
    <input id="shot4" type="file" accept="image/*">
    `
    :""
   }

   <button onclick="submitTask(${t.id},${y})">
   📤 জমা দিন
   </button>

   <button class="gray" onclick="showTasks()">
   ← ফিরে যান
   </button>

  </div>`;

 }catch(e){
  alert(e.message);
 }
}

function file64(f){
 return new Promise((res,rej)=>{
  if(!f)return res("");

  const r=new FileReader();

  r.onload=()=>res(r.result);
  r.onerror=rej;

  r.readAsDataURL(f);
 });
}

async function submitTask(id,y){
 try{

  const fs=[
   shot1.files[0],
   y?shot2.files[0]:null,
   y?shot3.files[0]:null,
   y?shot4.files[0]:null
  ];

  if(fs.some((x,i)=>i===0?!x:y&&!x)){
   alert(y?"৪টি Screenshot দিন":"Screenshot দিন");
   return;
  }

  await api("/api/tasks/"+id+"/submit",{
   method:"POST",
   body:JSON.stringify({
    screenshot1:await file64(fs[0]),
    screenshot2:await file64(fs[1]),
    screenshot3:await file64(fs[2]),
    screenshot4:await file64(fs[3])
   })
  });

  alert("Submission Admin-এর কাছে গেছে");

  showTasks();

 }catch(e){
  alert(e.message);
 }
}

async function adminPanel(tab="dashboard"){

 try{

  const d=await api("/api/admin/data");

  let h=`
  <div class="card">

   <h2>⚙️ Admin Panel</h2>

   <div class="tabs">

   ${
    ["dashboard","tasks","submissions","messages","withdrawals","users","logs"]
    .map(x=>`

    <button
    class="${tab===x?"tabActive":""}"
    onclick="adminPanel('${x}')">

    ${
     ({
      dashboard:"📊 Dashboard",
      tasks:"📌 Tasks",
      submissions:"📷 Submissions",
      messages:"💬 Messages",
      withdrawals:"💳 Withdraw",
      users:"👥 Users",
      logs:"📜 Logs"
     })[x]
    }

    </button>

    `).join("")
   }

   </div>`;

  if(tab==="dashboard")

   h+=`
   <div class="adminBox">

    <p>Users: <b>${d.users.length}</b></p>

    <p>Tasks: <b>${d.tasks.length}</b></p>

    <p>
    Pending Submission:
    <b>
    ${d.submissions.filter(x=>x.status==="pending").length}
    </b>
    </p>

    <p>
    Pending Withdraw:
    <b>
    ${d.withdrawals.filter(x=>x.status==="pending").length}
    </b>
    </p>

    <p>
    Unread User Messages:
    <b>${d.unreadMessages}</b>
    </p>

   </div>`;

  if(tab==="tasks")

   h+=`
   <button onclick="addTaskPage()">
   ➕ নতুন কাজ
   </button>

   ${
    d.tasks.map(t=>`

    <div class="adminBox">

     <span class="tag">
     ${taskTypeName(t.type)}
     </span>

     <h3>${esc(t.title)}</h3>

     <p>Reward: ${money(t.reward)}</p>

     <button
     class="red"
     onclick="deleteTask(${t.id})">
     🗑️ Delete
     </button>

    </div>

    `).join("")
   }`;

  if(tab==="submissions")

   h+=d.submissions.length

   ?

   d.submissions.map(s=>`

   <div class="adminBox">

    <h3>${esc(s.title)}</h3>

    <p>
    User: ${esc(s.login)}
    |
    Reward: ${money(s.reward)}
    </p>

    <p class="${s.status}">
    ${statusBn(s.status)}
    </p>

    ${
     s.reference_image
     ?
     `<p>Reference:</p>
     <img class="shot"
     src="${safeImage(s.reference_image)}">`
     :""
    }

    ${
     [s.screenshot1,s.screenshot2,s.screenshot3,s.screenshot4]
     .filter(Boolean)
     .map((x,i)=>`

     <p>Screenshot ${i+1}</p>

     <img class="shot"
     src="${safeImage(x)}">

     `).join("")
    }

    ${
     s.status==="pending"
     ?
     `
     <button class="green"
     onclick="approveSubmission(${s.id})">
     Approve
     </button>

     <button class="red"
     onclick="rejectSubmission(${s.id})">
     Reject
     </button>
     `
     :""
    }

   </div>

   `).join("")

   :

   "<p>কোনো Submission নেই</p>";

  if(tab==="messages")

   h+=`
   <p>
   ${d.unreadMessages}টি unread user message
   </p>
   `+

   d.users.map(u=>{

    const ms=d.messages.filter(
     m=>Number(m.user_id)===Number(u.id)
    );

    return ms.length

    ?

    `
    <div class="adminBox">

     <h3>${esc(u.login)}</h3>

     <div class="chat">

     ${
      ms.slice().reverse().map(m=>`

      <div class="msg ${m.sender}">

       <b>
       ${m.sender==="admin"?"Admin":"User"}:
       </b>

       ${esc(m.body)}

      </div>

      `).join("")
     }

     </div>

     <textarea
     id="reply_${u.id}"
     placeholder="Reply লিখুন">
     </textarea>

     <button onclick="replyUser(${u.id})">
     Reply
     </button>

    </div>
    `

    :"";

   }).join("");

  if(tab==="withdrawals")

   h+=d.withdrawals.map(w=>`

   <div class="adminBox">

    <b>${esc(w.login)}</b>

    <p>
    ${esc(w.method)}:
    ${esc(w.payout_number)}
    </p>

    <p>
    Amount: ${money(w.amount)}
    </p>

    <p>
    Status: ${esc(w.status)}
    </p>

    ${
     w.status==="pending"
     ?
     `
     <button
     class="green"
     onclick="approveWithdraw(${w.id})">
     Approve
     </button>

     <button
     class="red"
     onclick="rejectWithdraw(${w.id})">
     Reject
     </button>
     `
     :""
    }

   </div>

   `).join("");

  if(tab==="users")

   h+=d.users.map(u=>`

   <div class="adminBox">

    <b>${esc(u.login)}</b>

    <p>
    Balance: ${money(u.balance)}
    </p>

    <p>
    Referral: ${esc(u.referral_code)}
    </p>

    <p>
    Referred:
    ${
     d.users.filter(
      x=>Number(x.referred_by)===Number(u.id)
     ).length
    }
    জন
    </p>

    <button
    class="red"
    onclick="banUser(${u.id})">
    ৩ দিনের Ban
    </button>

   </div>

   `).join("");

  if(tab==="logs")

   h+=d.logs.map(l=>`

   <div class="adminBox">

    <b>${esc(l.action)}</b>

    <p>
    Actor: ${esc(l.actor)}
    ${l.login?`| User: ${esc(l.login)}`:""}
    </p>

    <p>${esc(l.details||"")}</p>

    <span class="small">
    ${new Date(l.created_at).toLocaleString("bn-BD")}
    </span>

   </div>

   `).join("");

  h+=`
  </div>

  <button class="gray" onclick="home()">
  ← Home
  </button>`;

  app.innerHTML=h;

 }catch(e){
  alert(e.message);
 }
}

function addTaskPage(){

 app.innerHTML=`
 <div class="card">

  <h2>➕ নতুন কাজ</h2>

  <select id="taskType"
  onchange="taskTypeChanged()">

   <option value="ad">
   Ad দেখা
   </option>

   <option value="facebook">
   Facebook Like + Screenshot
   </option>

   <option value="youtube">
   YouTube + ৪ Screenshot
   </option>

  </select>

  <input id="taskTitle"
  placeholder="Title">

  <textarea id="taskDescription"
  placeholder="নির্দেশনা">
  </textarea>

  <input id="taskUrl"
  placeholder="URL">

  <input id="taskReward"
  type="number"
  step=".01"
  placeholder="Reward">

  <div id="secondsBox">

   <input id="taskSeconds"
   type="number"
   min="1"
   value="15"
   placeholder="Seconds">

  </div>

  <div id="referenceBox"
  class="hidden">

   <p>Reference Screenshot</p>

   <input id="referenceFile"
   type="file"
   accept="image/*">

  </div>

  <button onclick="createTask()">
  Publish
  </button>

  <button class="gray"
  onclick="adminPanel('tasks')">
  ← Admin
  </button>

 </div>`;
}

function taskTypeChanged(){

 const a=taskType.value==="ad";

 secondsBox.classList.toggle("hidden",!a);

 referenceBox.classList.toggle("hidden",a);
}

async function createTask(){

 try{

  let ref="";

  if(taskType.value!=="ad"){

   const f=referenceFile.files[0];

   if(!f)
   return alert("Reference Screenshot দিন");

   ref=await file64(f);
  }

  await api("/api/admin/tasks",{
   method:"POST",
   body:JSON.stringify({
    type:taskType.value,
    title:taskTitle.value,
    description:taskDescription.value,
    url:taskUrl.value,
    reward:Number(taskReward.value),
    minSeconds:Number(taskSeconds.value),
    referenceImage:ref
   })
  });

  alert("Task Publish হয়েছে");

  adminPanel("tasks");

 }catch(e){
  alert(e.message);
 }
}

async function deleteTask(id){

 if(!confirm("Delete করবেন?"))
 return;

 try{

  await api("/api/admin/tasks/"+id,{
   method:"DELETE"
  });

  adminPanel("tasks");

 }catch(e){
  alert(e.message);
 }
}
