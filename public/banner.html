<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>বেকার থাকার দিন শেষ - Banner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow: hidden;
    }

    .banner {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .banner img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1920px;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div class="banner">
    <img src="/banner.png" alt="বেকার থাকার দিন শেষ">
  </div>

</body>
  </html>
